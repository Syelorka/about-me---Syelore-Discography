<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — SYELORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="overlay"></div>
  <main class="contact">

    <h1 class="page-title">Contact</h1>

    <form class="contact-form">
      <input 
        name="name" 
        placeholder="Your name"
        required
      >

      <input 
        type="email" 
        name="email" 
        placeholder="Your email"
        required
      >

      <textarea 
        name="message" 
        placeholder="Your message"
        required
      ></textarea>

      <button type="submit">Send message</button>

    </form>

  </main>

</body>
<footer class="footer">© 2026 SYELORE</footer>
</html>
