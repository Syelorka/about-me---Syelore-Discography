<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact — SYELORE</title>
</head>

<body>

    <h1 class="page-title">Contact</h1>

    <form class="contact-form">
      <input 
        type="text" 
        name="name" 
        placeholder="Your name"
        required
      >

      <input 
        type="email" 
        name="email" 
        placeholder="Your email"
        required
      >

      <textarea 
        name="message" 
        placeholder="Your message"
        required
      ></textarea>

      <button type="submit">Send message</button>

    </form>

</body>
<footer class="footer">© 2026 SYELORE</footer>
</html>
